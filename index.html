<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="《月底还剩三百块》：一个关于七天生活、选择与交换关系的剧情游戏。">
  <title>月底还剩三百块</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" id="brand" aria-label="回到游戏当前画面">
        <span class="brand-mark" aria-hidden="true">¥</span>
        <span>月底还剩三百块</span>
      </a>
      <div class="topbar-right">
        <span id="day-chip" class="day-chip">七天的故事</span>
        <button id="menu-button" class="icon-button mobile-only" type="button" aria-label="打开账本与日程" aria-expanded="false">☷</button>
      </div>
    </header>

    <div class="layout">
      <main id="main" class="main" aria-live="polite"></main>

      <aside id="sidebar" class="sidebar" aria-label="本局状态与账本">
        <div class="sidebar-top">
          <p class="eyebrow">本周状态</p>
          <button id="close-sidebar" class="icon-button mobile-only" type="button" aria-label="关闭状态面板">×</button>
        </div>
        <div id="hud"></div>
        <div id="schedule"></div>
        <div id="ledger"></div>
        <div class="sidebar-actions">
          <button id="advance-button" class="subtle-button hidden" type="button">向家人预支下周生活费 100 元</button>
          <button id="restart-button" class="subtle-button" type="button">重新开始</button>
        </div>
      </aside>
    </div>
  </div>
  <div id="overlay" class="overlay hidden" aria-hidden="true"></div>
  <dialog id="detail-dialog" class="detail-dialog">
    <button id="close-dialog" class="dialog-close" type="button" aria-label="关闭">×</button>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
