<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="《月底还剩三百块》：一个关于七天生活、选择与交换关系的剧情游戏。">
  <title>月底还剩三百块</title>
  <link rel="stylesheet" href="styles.css?v=20261015-review">
  <script src="game.js?v=20261016-next-week" defer></script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header id="topbar" class="topbar">
      <a class="brand" href="#" id="brand" aria-label="回到游戏当前画面">
        <span class="brand-mark" aria-hidden="true">¥</span>
        <span>月底还剩三百块</span>
      </a>
      <div class="topbar-right">
        <span id="day-chip" class="day-chip">七天的故事</span>
        <button id="menu-button" class="icon-button mobile-only" type="button" aria-label="打开账本与日程" aria-expanded="false">☷</button>
      </div>
    </header>
    <button id="quick-status" class="quick-status mobile-only hidden" type="button" aria-label="查看余额、疲劳与任务进度，打开状态面板"></button>
    <p id="storage-notice" class="storage-notice hidden" role="status"></p>

    <div class="layout">
      <main id="main" class="main" aria-live="polite"></main>

      <aside id="sidebar" class="sidebar" aria-label="本局状态与账本">
        <div class="sidebar-top">
          <p class="eyebrow">本周状态</p>
          <button id="close-sidebar" class="icon-button mobile-only" type="button" aria-label="关闭状态面板">×</button>
        </div>
        <div id="hud"></div>
        <div id="schedule"></div>
        <div id="ledger"></div>
        <div class="sidebar-actions">
          <button id="advance-button" class="subtle-button hidden" type="button">向家人预支下周生活费 100 元</button>
          <button id="restart-button" class="subtle-button" type="button">重新开始</button>
        </div>
      </aside>
    </div>
  </div>
  <div id="scene-transition" class="scene-transition hidden" role="status" aria-live="polite" aria-hidden="true">
    <div class="transition-panel">
      <span id="transition-symbol" class="transition-symbol" aria-hidden="true"></span>
      <p id="transition-kicker" class="transition-kicker"></p>
      <h2 id="transition-title" class="transition-title"></h2>
      <p id="transition-detail" class="transition-detail"></p>
      <div class="transition-progress" aria-hidden="true"><span></span></div>
      <button id="skip-transition" class="transition-skip" type="button">跳过过场</button>
    </div>
  </div>
  <div id="overlay" class="overlay hidden" aria-hidden="true"></div>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="dialog-title">
    <button id="close-dialog" class="dialog-close" type="button" aria-label="关闭">×</button>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
